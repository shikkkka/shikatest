<!DOCTYPE html>
<html>
<head>
    <title>分析结果</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f5f5f5; }
        .warning { color: #d32f2f; }
        .download-btn { background: #2196F3; color: white; }
        .back-btn { background: #9E9E9E; }
    </style>
</head>
<body>
    <h2>分析结果 (前10条)</h2>
    {{ table|safe }}

    <p>共分析 {{ total }} 条记录</p>

    <button class="download-btn" onclick="window.location.href='/download'">
        下载完整结果 (CSV)
    </button>

    <button class="back-btn" onclick="window.history.back()">返回</button>
</body>
</html>
